[package]
name = "lunis-display-fixer"
version = "0.1.1"
edition = "2021"
description = "Sim Racing Display Fixer - keep your triple screens (or any display) at the resolution and refresh you want."
authors = ["Lunis"]

[lib]
name = "lunis_display_fixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lunis-display-fixer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lunis-display-core = { path = "../core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
