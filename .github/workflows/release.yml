name: release

# Push a tag like v0.2.0 to build the app, package the NSIS installer, sign it, publish a GitHub
# Release, and emit latest.json (the manifest the in-app updater polls).
#
# Requires one repo secret:
#   TAURI_SIGNING_PRIVATE_KEY  - contents of the minisign private key file (no password)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: cargo build -p sim-racing-display-fixer --release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/packaged | Out-Null
          # NOTE: the braces are required - "$env:ProgramFiles(x86)" parses as ProgramFiles
          # followed by a literal "(x86)" and silently yields the wrong path.
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = Join-Path $env:ProgramFiles "NSIS\makensis.exe" }
          Write-Host "using $nsis"
          & $nsis /DVERSION=${{ steps.ver.outputs.version }} packaging/installer.nsi

      - name: Sign installer
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked
          $keyFile = Join-Path $env:RUNNER_TEMP "signing.key"
          Set-Content -Path $keyFile -Value $env:KEY -NoNewline
          cargo tauri signer sign -f $keyFile -p "" "target/packaged/SimDisplayFixer-${{ steps.ver.outputs.version }}-setup.exe"
          Remove-Item $keyFile -Force

      - name: Build latest.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $setup = "SimDisplayFixer-$v-setup.exe"
          $sig = Get-Content "target/packaged/$setup.sig" -Raw
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$setup"
          $manifest = [ordered]@{
            version   = $v
            notes     = "Sim Display Fixer $v"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig.Trim(); url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "target/packaged/latest.json" -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sim Display Fixer ${{ github.ref_name }}
          body: |
            Keeps your sim rig's screens at the resolution and refresh rate you want, and puts them
            back when a reboot or driver knocks them out of place.

            **Download the setup `.exe` below and run it.** It installs for the current user, needs no
            admin, and updates itself from then on.

            Windows 10/11 64-bit. Any GPU. Native app, no runtime to install.

            Free for personal use. Commercial use requires a license: **contact@lunis.live**
          files: |
            target/packaged/SimDisplayFixer-${{ steps.ver.outputs.version }}-setup.exe
            target/packaged/SimDisplayFixer-${{ steps.ver.outputs.version }}-setup.exe.sig
            target/packaged/latest.json
